# Sobe tudo: banco, API e front.   docker compose up --build   ->   http://localhost:4200
# Para rodar só o banco (e a API/front na máquina), use:   docker compose up -d db
services:
  db:
    image: postgres:16-alpine
    container_name: prova-db
    environment:
      POSTGRES_DB: ${DB_NAME:-prova}
      POSTGRES_USER: ${DB_USER:-prova}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no arquivo .env}
    ports:
      # Só a própria máquina acessa o banco.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - prova-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-prova} -d ${DB_NAME:-prova}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    container_name: prova-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Dentro do Docker a API enxerga o banco pelo nome do serviço, na porta interna 5432.
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-prova}
      DB_USER: ${DB_USER:-prova}
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no arquivo .env}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no arquivo .env}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-120}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@globalti.com.br}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
    ports:
      - "127.0.0.1:8080:8080"

  web:
    build: ./frontend
    container_name: prova-web
    depends_on:
      - api
    ports:
      - "4200:80"

volumes:
  prova-dados:
