server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # O front chama "/api/...": o nginx repassa para a API (serviço "api" do docker-compose).
    # Assim o navegador fala só com um endereço e não precisa de CORS.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA: qualquer rota que não é arquivo volta para o index.html e o Angular resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
